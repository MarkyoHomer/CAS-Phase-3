<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Earnings - CAS</title>
  <link rel="icon" href="../../cas.ico" type="image/x-icon">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../camis.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
</head>
<body>
<div class="wrapper">
  <div id="sidebar-root"></div>
  <div class="tab-container">
    <div class="headwrapper">
      <header>
        <nav style="width:75%;font-size:16px;font-weight:bold;" id="xtitle">Manage Earnings</nav>
        <div style="color:white;font-size:16px;font-weight:bold;">
          <button type="button" onclick="logout()" style="cursor:pointer;float:right;background:transparent;border:none;margin-right:100px;height:20px;width:25px;">
            <i style="color:white;" class="fas fa-right-to-bracket"></i>
          </button>
          <ul style="float:right;margin-right:10px;">-user</ul>
          <ul style="float:right;margin-right:0;" id="userRole"></ul>
        </div>
      </header>
    </div>
    <div class="content active"><br><br>
      <div class="form-container">
        <form style="min-width:1100px;">
          <header style="font-size:16px;background-color:rgb(7,21,110);height:35px;margin-bottom:10px;padding:10px;box-shadow:none;">
            <i class="fas fa-money-bill-1" style="margin-right:15px;font-size:12px;"></i>Manage Earning Setup
          </header>
          <button type="button" onclick="openEarningSetupForm(null)" class="custom-button-blue" style="float:right;margin-right:20px;margin-bottom:10px;width:130px;">
            <i class="fas fa-square-plus" style="float:left;color:white;font-size:14px;margin-left:10px;"></i>Add Item
          </button><br><br>
          <fieldset style="width:99%;margin:5px;box-shadow:none;border:3px solid black;height:400px;">
            <div class="table-container">
              <table class="ftscroll" id="earningSetupTable" style="height:360px;">
                <thead><tr><th style="width:40px;">Edit</th><th>Name</th><th>With Activation</th><th>Status</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </fieldset>
          <!-- Earning Setup Form Overlay -->
          <div id="earningSetupForm" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center;">
            <div style="background:#fff;padding:20px;min-width:400px;border-radius:4px;">
              <li style="font-weight:700;font-size:15px;"><i class="fas fa-money-bill-1" style="margin-right:10px;color:rgb(7,21,110);"></i>Earning Item</li><br>
              <fieldset style="border:1px solid #ccc;padding:15px;box-shadow:none;">
                <nav style="margin-bottom:12px;">
                  <label style="font-size:13px;color:gray;">Item Name:</label><br>
                  <input type="text" id="earningItemName" style="width:100%;font-size:13px;border:none;border-bottom:1px solid #ccc;">
                </nav>
                <nav style="margin-bottom:12px;display:flex;gap:20px;">
                  <label style="font-size:13px;"><input type="checkbox" id="earningWithActivation" style="margin-right:6px;">With Activation</label>
                  <label style="font-size:13px;"><input type="checkbox" id="earningIsActive" checked style="margin-right:6px;">Active</label>
                </nav>
                <nav style="text-align:right;margin-top:10px;">
                  <button type="button" onclick="document.getElementById('earningSetupForm').style.display='none'" class="custom-button-gray" style="width:80px;margin-right:10px;">Cancel</button>
                  <button type="button" onclick="submitEarningSetupForm()" class="custom-button-blue" style="width:80px;">Save</button>
                </nav>
              </fieldset>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="../../general_script.js"></script>
<script type="module">
  import { initCamisEarnings, openEarningSetupForm, submitEarningSetupForm } from './camis_earnings.js';
  import { initAuthGuard } from '../shared/auth_guard.js';
  window.openEarningSetupForm = openEarningSetupForm;
  window.submitEarningSetupForm = submitEarningSetupForm;
  initAuthGuard((user) => { document.getElementById('userRole').innerText = user.role; initCamisEarnings(); });
</script>
<script src="../../sidebar.js"></script>
<script src="../../page-shell.js"></script>
</body>
</html>
