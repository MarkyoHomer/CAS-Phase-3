<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Employee Roles - CAS</title>
  <link rel="icon" href="../../cas.ico" type="image/x-icon">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../camis.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
</head>
<body>
<div class="wrapper">
  <div id="sidebar-root"></div>
  <div class="tab-container">
    <div class="headwrapper">
      <header>
        <nav style="width:75%;font-size:16px;font-weight:bold;" id="xtitle">Manage Employee Roles</nav>
        <div style="color:white;font-size:16px;font-weight:bold;">
          <button type="button" onclick="logout()" style="cursor:pointer;float:right;background:transparent;border:none;margin-right:100px;height:20px;width:25px;">
            <i style="color:white;" class="fas fa-right-to-bracket"></i>
          </button>
          <ul style="float:right;margin-right:10px;">-user</ul>
          <ul style="float:right;margin-right:0;" id="userRole"></ul>
        </div>
      </header>
    </div>
    <div class="content active"><br><br>
      <div class="form-container">
        <form style="min-width:1100px;">
          <header style="font-size:16px;background-color:rgb(7,21,110);height:35px;margin-bottom:10px;padding:10px;box-shadow:none;">
            <i class="fas fa-users" style="margin-right:15px;font-size:12px;"></i>Manage Employee Roles
          </header>
          <button type="button" class="custom-button-blue" style="float:right;margin-right:20px;margin-bottom:10px;width:130px;">
            <i class="fas fa-square-plus" style="float:left;color:white;font-size:14px;margin-left:10px;"></i>Add Role
          </button><br><br>
          <fieldset style="width:99%;margin:5px;box-shadow:none;border:3px solid black;height:400px;">
            <table class="ftscroll" style="height:360px;width:100%;">
              <thead><tr><th style="width:40px;">Edit</th><th>Role Name</th><th>Description</th><th>Max Fulltime</th><th>Status</th></tr></thead>
              <tbody>
                <tr><td></td><td>BH</td><td>Branch Head</td><td>1</td><td>Active</td></tr>
                <tr><td></td><td>Cashier</td><td>Branch Cashier</td><td>1</td><td>Active</td></tr>
                <tr><td></td><td>Security Guard</td><td>SG Employee</td><td>1</td><td>Active</td></tr>
                <tr><td></td><td>PSB Associate</td><td>PSB Staff</td><td>1</td><td>Active</td></tr>
                <tr><td></td><td>PEPP Operator</td><td>PEPP Staff</td><td>Unlimited</td><td>Active</td></tr>
              </tbody>
            </table>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="../../general_script.js"></script>
<script src="../../sidebar.js"></script>
<script src="../../page-shell.js"></script>
</body>
</html>
