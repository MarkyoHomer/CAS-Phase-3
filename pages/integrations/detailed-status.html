<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detailed Status - CAS</title>
  <link rel="icon" href="../../cas.ico" type="image/x-icon">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../camis.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
</head>
<body>
<div class="wrapper">
  <div id="sidebar-root"></div>
  <div class="tab-container">
    <div class="headwrapper">
      <header>
        <nav style="width:75%;font-size:16px;font-weight:bold;" id="xtitle">Detailed Status</nav>
        <div style="color:white;font-size:16px;font-weight:bold;">
          <button type="button" onclick="logout()" style="cursor:pointer;float:right;background:transparent;border:none;margin-right:100px;height:20px;width:25px;">
            <i style="color:white;" class="fas fa-right-to-bracket"></i>
          </button>
          <ul style="float:right;margin-right:10px;">-user</ul>
          <ul style="float:right;margin-right:0;" id="userRole"></ul>
        </div>
      </header>
    </div>
    <div class="content active"><br><br>
      <div class="form-container">
        <form>
          <div class="subtab-container">
            <div class="subtabs"></div>
            <div class="subRtab active" id="sub-tab1-tab1" onclick="openTab(event,'subcon-tab1-tab1')">Transactions by Branch</div>
          </div>
          <div id="subcon-tab1-tab1" class="subRcontent active-subRtab-content">
            <nav style="margin-left:20px;width:180px;">
              <label style="font-size:10px;color:gray;" for="datefrom">Start Date:</label><br>
              <input type="date" id="datefrom" name="datefrom">
            </nav>
            <nav>
              <label style="font-size:10px;color:gray;" for="dateto">End Date:</label><br>
              <input type="date" id="dateto" name="dateto">
            </nav>
            <nav style="width:140px;"><br>
              <input type="text" id="branch1" placeholder="Branch">
            </nav>
            <nav><br>
              <button type="button" class="custom-button-white">SEARCH</button>
            </nav><br><br>
            <fieldset style="width:100%;margin-top:40px;">
              <div class="search-container">
                <nav style="width:72%;text-align:left;margin-left:15px;font-size:14px;font-weight:bold;">
                  <h4>Transactions</h4>
                </nav>
                <nav style="width:25%;">
                  <div class="input-container-small" style="margin-bottom:10px;">
                    <i class="fas fa-magnifying-glass" style="color:rgb(132,176,248);font-size:14px;margin-left:10px"></i>
                    <input type="text" id="myTextField" placeholder="Search">
                    <button type="button" onclick="alert('Button clicked!')">x</button>
                  </div>
                </nav>
              </div>
              <table id="myTable">
                <thead>
                  <tr>
                    <th>Branch Code</th><th>Reference Number</th><th>External Id</th>
                    <th>Template Name</th><th>Transaction State</th><th>Transaction TimeStamp</th><th>Action</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </fieldset>
          </div>
          <div class="pagination">
            <select style="width:53px;border:none;" id="contpage2" name="contpage">
              <option value="5">5</option><option value="10">10</option>
              <option value="20">20</option><option value="50">50</option>
            </select>
            <button type="button" id="topBtn" onclick="changePage(-1)" class="disabled" disabled>l&lt;</button>
            <button type="button" id="prevBtn" onclick="changePage(-1)" class="disabled" disabled>&lt;</button>
            <button type="button" id="count" class="disabled" disabled>0-0 of 0</button>
            <button type="button" id="nextBtn" onclick="changePage(1)" class="disabled" disabled>&gt;</button>
            <button type="button" id="fwdBtn" onclick="changePage(1)" class="disabled" disabled>&gt;l</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="../../general_script.js"></script>
<script src="../../sidebar.js"></script>
<script src="../../page-shell.js"></script>
</body>
</html>
