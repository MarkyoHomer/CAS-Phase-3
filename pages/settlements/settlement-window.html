<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settlement Window - CAS</title>
  <link rel="icon" href="../../cas.ico" type="image/x-icon">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../camis.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrapper">
  <div id="sidebar-root"></div>
  <div class="tab-container">
    <div class="headwrapper">
      <header>
        <nav style="width:75%;font-size:16px;font-weight:bold;" id="xtitle">CAMIS Settlement Window</nav>
        <div style="color:white;font-size:16px;font-weight:bold;">
          <button type="button" onclick="logout()" style="cursor:pointer;float:right;background:transparent;border:none;margin-right:100px;height:20px;width:25px;">
            <i style="color:white;" class="fas fa-right-to-bracket"></i>
          </button>
          <ul style="float:right;margin-right:10px;">-user</ul>
          <ul style="float:right;margin-right:0;" id="userRole"></ul>
        </div>
      </header>
    </div>
    <div class="content active"><br><br>
      <div class="form-container">
        <form style="min-width:1100px;">
          <header style="font-size:16px;background-color:rgb(7,21,110);height:35px;margin-bottom:10px;padding:10px;box-shadow:none;">
            <i class="fas fa-money-bill-transfer" style="margin-right:15px;font-size:12px;"></i>CAMIS Settlement Window
          </header>
          <!-- Filter bar -->
          <fieldset style="width:99%;margin:5px;box-shadow:none;border:1px solid #ccc;padding:10px;">
            <nav style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
              <div><label style="font-size:12px;color:gray;">Date From:</label><br><input type="date" id="camisSETDatefr" style="font-size:12px;width:150px;"></div>
              <div><label style="font-size:12px;color:gray;">Date To:</label><br><input type="date" id="camisSETDateto" style="font-size:12px;width:150px;"></div>
              <div><label style="font-size:12px;color:gray;">Area:</label><br><input type="text" id="camisSETArea" placeholder="All Areas" style="font-size:12px;width:120px;border:none;border-bottom:1px solid #ccc;"></div>
              <div><label style="font-size:12px;color:gray;">Branch:</label><br><input type="text" id="camisSETBranch" placeholder="All Branches" style="font-size:12px;width:120px;border:none;border-bottom:1px solid #ccc;"></div>
              <div>
                <label style="font-size:12px;color:gray;">Status (multi-select):</label><br>
                <select id="camisSettleStatusList" multiple style="font-size:12px;width:160px;height:60px;">
                  <option value="Unsettled">Unsettled</option>
                  <option value="Partial">Partial</option>
                  <option value="Settled">Settled</option>
                </select>
              </div>
              <div><label style="font-size:12px;color:gray;">Employee No.:</label><br><input type="text" id="camisSETEmp" placeholder="All" style="font-size:12px;width:120px;border:none;border-bottom:1px solid #ccc;"></div>
              <div style="align-self:flex-end;">
                <button type="button" onclick="filterCamisSettlements()" class="custom-button-blue" style="width:100px;"><i class="fas fa-filter" style="margin-right:5px;"></i>Filter</button>
                <button type="button" onclick="exportCamisSettlementsExcel(window._camisSettleFilters||{})" class="custom-button-gray" style="width:100px;margin-left:5px;"><i class="fas fa-download" style="margin-right:5px;"></i>Export</button>
              </div>
            </nav>
          </fieldset>
          <fieldset style="width:99%;margin:5px;box-shadow:none;border:3px solid black;height:380px;">
            <div class="table-container">
              <table class="ftscroll" id="CAMISsettletable" style="height:340px;">
                <thead>
                  <tr>
                    <th style="width:40px;">View</th><th>Date</th><th>Area</th><th>Branch</th>
                    <th>Template</th><th>Employee No.</th><th>Employee Name</th>
                    <th>Amount</th><th>Settled</th><th>Remaining</th><th>Status</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </fieldset>
          <!-- CAMIS Settle Record Overlay -->
          <div id="camisSettleOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center;">
            <div style="background:#fff;padding:20px;min-width:500px;border-radius:4px;">
              <li style="font-weight:700;font-size:15px;">Settle Record</li><br>
              <fieldset style="border:1px solid #ccc;padding:15px;box-shadow:none;">
                <nav style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;">
                  <div><label style="font-size:12px;color:gray;">Date:</label><br><input type="text" id="camisSetDate" readonly style="font-size:12px;width:120px;border:none;border-bottom:1px solid #ccc;color:gray;"></div>
                  <div><label style="font-size:12px;color:gray;">Branch:</label><br><input type="text" id="camisSetBranch" readonly style="font-size:12px;width:100px;border:none;border-bottom:1px solid #ccc;color:gray;"></div>
                  <div><label style="font-size:12px;color:gray;">Area:</label><br><input type="text" id="camisSetArea" readonly style="font-size:12px;width:100px;border:none;border-bottom:1px solid #ccc;color:gray;"></div>
                </nav>
                <nav style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;">
                  <div><label style="font-size:12px;color:gray;">Employee:</label><br><input type="text" id="camisSetEmp" readonly style="font-size:12px;width:200px;border:none;border-bottom:1px solid #ccc;color:gray;"></div>
                  <div><label style="font-size:12px;color:gray;">Amount:</label><br><input type="text" id="camisSetAmount" readonly style="font-size:12px;width:120px;border:none;border-bottom:1px solid #ccc;color:gray;"></div>
                  <div><label style="font-size:12px;color:gray;">Settled:</label><br><input type="text" id="camisSetSettled" readonly style="font-size:12px;width:120px;border:none;border-bottom:1px solid #ccc;color:gray;"></div>
                  <div><label style="font-size:12px;color:gray;">Remaining:</label><br><input type="text" id="camisSetRemaining" readonly style="font-size:12px;width:120px;border:none;border-bottom:1px solid #ccc;color:gray;"></div>
                  <div><label style="font-size:12px;color:gray;">Status:</label><br><input type="text" id="camisSetStatus" readonly style="font-size:12px;width:100px;border:none;border-bottom:1px solid #ccc;color:gray;"></div>
                </nav>
                <nav style="text-align:right;margin-top:10px;">
                  <button type="button" onclick="document.getElementById('camisSettleOverlay').style.display='none';" class="custom-button-gray" style="width:80px;">Close</button>
                </nav>
              </fieldset>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<div id="xnotification" class="xnotification"><p style="font-size:14px;margin:10px;" id="xnotify"></p></div>

<script src="../../general_script.js"></script>
<script type="module">
  import { initCamisSettlements, renderCamisSettlementTable, exportCamisSettlementsExcel } from './camis_settlements.js';
  import { initAuthGuard } from '../shared/auth_guard.js';

  window.filterCamisSettlements = function () {
    const statuses = Array.from(document.getElementById('camisSettleStatusList')?.selectedOptions || []).map(o => o.value);
    const filters = {
      dateFrom: document.getElementById('camisSETDatefr')?.value || '',
      dateTo  : document.getElementById('camisSETDateto')?.value || '',
      area    : document.getElementById('camisSETArea')?.value   || '',
      branch  : document.getElementById('camisSETBranch')?.value || '',
      statuses,
      employeeNumber: document.getElementById('camisSETEmp')?.value || '',
    };
    window._camisSettleFilters = filters;
    renderCamisSettlementTable(filters);
  };

  window.exportCamisSettlementsExcel = exportCamisSettlementsExcel;

  initAuthGuard((user) => {
    document.getElementById('userRole').innerText = user.role;
    initCamisSettlements();
  });
</script>
<script src="../../sidebar.js"></script>
<script src="../../page-shell.js"></script>
</body>
</html>
